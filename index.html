.lesson-unit-title {

.lesson-grid {
  display: grid;
  grid-template-columns: 92px 1fr 1fr;
}

.lesson-row {
  display: contents;
}

.lesson-side {
  padding: 18px 10px;
  border-top: 1px solid #ece7f6;
  border-right: 1px solid #ece7f6;
  text-align: center;
  background: rgba(255,255,255,0.68);
}

.lesson-side-emoji {
  font-size: 22px;
  margin-bottom: 6px;
}

.lesson-side-code {

  font-weight: 900;

  margin-bottom: 6px;

  font-size: 12px;
  color: #7b7b90;
  line-height: 1.2;
}

.lesson-part {
  padding: 18px 10px;
  border-top: 1px solid #ece7f6;
  text-align: center;
  background: rgba(255,255,255,0.92);
}

.lesson-part + .lesson-part {
  border-left: 1px solid #ece7f6;
}

.lesson-part-title {
  font-size: 15px;
  font-weight: 900;
  margin-bottom: 4px;
}

.lesson-part-count {
  font-size: 12px;
  color: #8a89a0;
  margin-bottom: 10px;
}

.lesson-play {
  border: none;
  border-radius: 999px;
  padding: 8px 14px;
  font-size: 14px;
  font-weight: 800;
  color: white;
  cursor: pointer;
  box-shadow: 0 6px 14px rgba(0,0,0,0.08);
}

.lesson-play.disabled {
  opacity: 0.3;
  pointer-events: none;
}

.unit-1 { color: #7c43d6; }

.unit-2 { color: #1296b9; }

.unit-2 .lesson-play { background: #1296b9; }

.unit-3 { color: #20a67f; }
.unit-3 .lesson-unit-header { background: linear-gradient(135deg, #daf8ef, #dff7ff); }
.unit-3 .lesson-play { background: #20a67f; }

.unit-4 { color: #e24b57; }

.unit-4 .lesson-play { background: #e24b57; }

.unit-5 .lesson-play { background: #ec7a2c; }

function showVocab() {
    getEl('homeSection').style.display = 'none';
    getEl('lessonSection').style.display = 'block';
    getEl('lessonPicker').style.display = 'block';
    getEl('lessonCard').style.display = 'none';

    const container = getEl('lessonButtons');
    container.innerHTML = ''; 

    // Tyto barvy jsou jemné, pastelové a méně syté
// Tyto barvy jsou syté a ladí k úvodu aplikace
const colors = ['#8A2BE2', '#FF1493', '#1E90FF', '#32CD32', '#FF8C00', '#00CED1'];
    const mainLessons = [...new Set(Object.keys(vocab).map(key => key.split(' ')[0].replace(/[A-Z]/g, '')))];

    mainLessons.forEach((num, index) => {
        const card = document.createElement('div');
        card.className = 'menu-card';
        const cardColor = colors[index % colors.length];
        card.style.cssText = `background:${cardColor}; color:white; padding:20px; border-radius:20px; text-align:center; cursor:pointer; font-weight:800; margin-bottom:12px; border:none; box-shadow: 0 4px 15px rgba(0,0,0,0.05);`;
        card.innerHTML = `Lekce ${num}`;
        card.onclick = () => showParts(num);
        container.appendChild(card);
    });
}

function showParts(lessonNum) {
    const container = getEl('lessonButtons');
    container.innerHTML = '';

    const parts = Object.keys(vocab).filter(key => key.startsWith(lessonNum));

    parts.forEach(key => {
        const card = document.createElement('div');
        card.className = 'menu-card';
        card.style.cssText = 'background:white; color:#8A2BE2; border:3px solid #8A2BE2; padding:15px; border-radius:20px; text-align:center; cursor:pointer; font-weight:800; margin-bottom:10px; box-shadow: 0 4px 10px rgba(0,0,0,0.05);';
        card.innerHTML = `Část ${key}`;
        card.onclick = () => startLesson(key);
        container.appendChild(card);
    });
    
    // Tlačítko pro návrat na výběr lekcí
    const backBtn = document.createElement('button');
    backBtn.className = 'secondary';
    backBtn.style.marginTop = '10px';

}

  function speak(text) {
  const utterance = new SpeechSynthesisUtterance(text);
  utterance.lang = 'en-GB';
  utterance.rate = 0.60;
  utterance.pitch = 1.0;

  const voices = window.speechSynthesis.getVoices();
  const preferredVoice = voices.find(v => v.lang === 'en-GB') || voices.find(v => v.lang && v.lang.startsWith('en'));
  if (preferredVoice) utterance.voice = preferredVoice;

  window.speechSynthesis.cancel();
  window.speechSynthesis.speak(utterance);
}

let speechUnlocked = false;

function unlockSpeech() {
  if (speechUnlocked || !('speechSynthesis' in window)) return;
  speechUnlocked = true;
  try {
    const warmup = new SpeechSynthesisUtterance('');
    warmup.volume = 0;
    window.speechSynthesis.cancel();
    window.speechSynthesis.speak(warmup);
  } catch (e) {}
}

function autoSpeak(text) {
  if (!text) return;
  const run = () => speak(text);
  if (speechUnlocked) {
    run();
  } else {
    setTimeout(run, 250);
  }
}

function listenAndCheck(expectedWord, callback, statusEl) {
    if (!statusEl) statusEl = document.getElementById('irrStatus') || document.getElementById('statusText');
  const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
  if (!SpeechRecognition) {
    alert('Tvůj prohlížeč nepodporuje rozpoznávání řeči. Zkus Chrome.');
    return;
  }
  const recognition = new SpeechRecognition();
  recognition.lang = 'en-GB';
  recognition.interimResults = false;
  recognition.maxAlternatives = 3;

  if (statusEl) statusEl.textContent = '🎤 Poslouchám...';
  let finished = false;

  const timeout = setTimeout(() => {
    if (finished) return;
    finished = true;
    try { recognition.stop(); } catch(e) {}
    if (statusEl) statusEl.textContent = '❌ Neslyším tě. Zkus znovu.';
  }, 7000);

  recognition.onresult = function(event) {
    if (finished) return;
    finished = true;
    clearTimeout(timeout);
    const results = Array.from(event.results[0]).map(r => r.transcript.toLowerCase().trim());
    const expected = expectedWord.toLowerCase().trim();
    const correct = results.some(r => r === expected);
    if (correct) {
      if (callback) { callback(true); }
      else {
        if (statusEl) statusEl.textContent = '✅ Výborně!';
        speak('Excellent!');
        setTimeout(() => {
          if (statusEl) statusEl.textContent = '';
          getEl('nextButton').click();
        }, 1500);
      }
    } else {
      if (callback) { callback(false); }
      else {
        if (statusEl) statusEl.textContent = '❌ Zkus to znovu!';
        speak('Listen again: ' + expectedWord);
        setTimeout(() => { if (statusEl) statusEl.textContent = ''; }, 2000);
      }
    }
  };

  recognition.onerror = function(event) {
    if (finished) return;
    finished = true;
    clearTimeout(timeout);
    if (event.error === 'not-allowed') {
      if (statusEl) statusEl.textContent = '🚫 Povol mikrofon a zkus znovu.';
    } else {
      if (statusEl) statusEl.textContent = '❌ Neslyším tě. Zkus znovu.';
    }
  };

  recognition.onspeechend = function() {
    try { recognition.stop(); } catch(e) {}
  };

  recognition.start();
}

    en.textContent = word.en;
    say.textContent = `[${word.h}]`;
    en.style.visibility = 'visible';
    say.style.visibility = 'visible';
    sBtn.style.display = 'none';
    if (mode === 'learn') {
      setTimeout(() => speak(word.en), 600);
    }
  } else {
    en.style.visibility = 'hidden';
    say.style.visibility = 'hidden';
    sBtn.style.display = 'block';
  }
  sBtn.textContent = 'Ukázat odpověď';
}

  // Inicializace tlačítek
  getEl('listenButton').onclick = () => {
  unlockSpeech();
  const word = vocab[currentPartKey][currentWordIndex];
  listenAndCheck(word.en, null, getEl('statusText'));
};
  getEl('learnButton').onclick = () => {
  mode = 'learn';
  answerVisible = true;
  renderCard();
};

getEl('testButton').onclick = () => {
  mode = 'test';
  answerVisible = false;
  renderCard();
};

getEl('startButton').onclick = () => {
  answerVisible = true;
  renderCard();
};

getEl('nextButton').onclick = () => {
  currentWordIndex++;

  if (currentWordIndex >= vocab[currentPartKey].length) {
    currentWordIndex = 0;
  }

  if (mode === 'test') {
    answerVisible = false;
  }

  renderCard();
};

let irregularIndex = 0;
let irregularStep = 0; // 0 = infinitiv, 1 = minulý čas

function showIrregular() {
  getEl('gradeSection').style.display = 'none';
  getEl('irregularSection').style.display = 'block';
  irregularIndex = 0;
  irregularStep = 0;
  renderIrregular();
}

function renderIrregular() {
  const verb = irregularVerbs[irregularIndex];
  getEl('irrCz').textContent = verb.cz;
  getEl('irrEn').textContent = verb.inf;
  getEl('irrHint').textContent = '[' + verb.hi + ']';
  getEl('irrPast').textContent = verb.past;
  getEl('irrHintPast').textContent = '[' + verb.hp + ']';
  if (irregularStep === 0) {
    getEl('irrStepLabel').textContent = '👉 ŘEKNI INFINITIV';
    getEl('irrStatus').textContent = 'Řekni anglický infinitiv';
    setTimeout(() => autoSpeak(verb.inf), 1000);
  } else {
    getEl('irrStepLabel').textContent = '👉 ŘEKNI MINULÝ ČAS';
    getEl('irrStatus').textContent = 'Řekni minulý čas';
    setTimeout(() => autoSpeak(verb.past), 1000);
  }
}

getEl('irregularButton').onclick = () => { unlockSpeech(); showIrregular(); };
getEl('irrListenBtn').onclick = () => {
  unlockSpeech();
  const verb = irregularVerbs[irregularIndex];
  const expected = irregularStep === 0 ? verb.inf : verb.past;
  listenAndCheck(expected, function(ok) {
    if (ok) {
      getEl('irrStatus').textContent = '✅ Výborně!';
      speak('Excellent!');
      setTimeout(() => {
        if (irregularStep === 0) {
          irregularStep = 1;
          renderIrregular();
        } else {
          irregularStep = 0;
          irregularIndex++;
          if (irregularIndex >= irregularVerbs.length) {
            getEl('irrStatus').textContent = '🎉 Výborně! Prošla jsi všechna slovesa!';
          } else {
            renderIrregular();
          }
        }
      }, 1500);
    } else {
      getEl('irrStatus').textContent = '❌ Zkus to znovu!';
      speak('Listen again: ' + expected);
    }
  }, getEl('irrStatus'));
};

getEl('irrNextBtn').onclick = () => {
  if (irregularStep === 0) {
    irregularStep = 1;
  } else {
    irregularStep = 0;
    irregularIndex++;
  }
  if (irregularIndex >= irregularVerbs.length) {
    getEl('irrStatus').textContent = '🎉 Hotovo!';
  } else {
    renderIrregular();
  }
};

function showGeneratedChunksMenu() {
  getEl('homeSection').style.display = 'none';

  const container = getEl('chunksButtons');
  container.innerHTML = '';

  const colors = ['#8A2BE2', '#FF1493', '#1E90FF', '#32CD32', '#FF8C00', '#00CED1'];

  for (let i = 1; i <= 6; i++) {
    const card = document.createElement('div');
    card.className = 'menu-card';
    const cardColor = colors[(i - 1) % colors.length];
    card.style.cssText = `background:${cardColor}; color:white; padding:20px; border-radius:20px; text-align:center; cursor:pointer; font-weight:800; margin-bottom:12px; border:none; box-shadow: 0 4px 15px rgba(0,0,0,0.05);`;
    card.innerHTML = `Lekce ${i}`;
    card.onclick = () => {
  alert(`Lekce ${i} zatím nemá obsah.`);
};
    container.appendChild(card);
  }

  const backBtn = document.createElement('button');
  backBtn.className = 'secondary';
  backBtn.style.marginTop = '10px';
  backBtn.innerHTML = '← Zpět na úvod';
  backBtn.onclick = () => {
    getEl('chunksSection').style.display = 'none';
    getEl('homeSection').style.display = 'block';
  };
  container.appendChild(backBtn);
}

let currentChunkKey = null;
let currentChunkIndex = 0;
let chunkMode = 'learn';
let chunkAnswerVisible = true;

function showChunks() {
  getEl('homeSection').style.display = 'none';
  getEl('lessonSection').style.display = 'none';
  getEl('irregularSection').style.display = 'none';
  getEl('chunksSection').style.display = 'block';
  getEl('chunksPicker').style.display = 'block';
  getEl('chunksCard').style.display = 'none';

  const container = getEl('chunksButtons');
  container.innerHTML = '';

  const lessons = Object.keys(chunks);
  const colors = ['#8A2BE2', '#FF1493', '#1E90FF', '#32CD32', '#FF8C00', '#00CED1'];

  lessons.forEach((key, index) => {
    const card = document.createElement('div');
    card.className = 'menu-card';
    const cardColor = colors[index % colors.length];
    card.style.cssText = `background:${cardColor}; color:white; padding:20px; border-radius:20px; text-align:center; cursor:pointer; font-weight:800; margin-bottom:12px; border:none; box-shadow: 0 4px 15px rgba(0,0,0,0.05);`;
    card.innerHTML = `Lekce ${index + 1}`;
    card.onclick = () => startChunks(key);
    container.appendChild(card);
  });

  const backBtn = document.createElement('button');
  backBtn.className = 'secondary';
  backBtn.style.marginTop = '10px';
  backBtn.innerHTML = '← Zpět na úvod';
  backBtn.onclick = () => {
    getEl('chunksSection').style.display = 'none';
    getEl('homeSection').style.display = 'block';
  };
  container.appendChild(backBtn);
}

getEl('learnChunkButton').onclick = () => {
  chunkMode = 'learn';
  chunkAnswerVisible = true;

  renderChunkCard();
};

getEl('testChunkButton').onclick = () => {
  chunkMode = 'test';
  chunkAnswerVisible = false;

  renderChunkCard();
};

getEl('startChunkButton').onclick = () => {
  chunkAnswerVisible = true;

  renderChunkCard();
};
 
getEl('listenChunkButton').onclick = () => {
  const chunk = currentChunkKey === '__generated_chunks_lesson_1__'
    ? generatedChunksLesson1[currentChunkIndex]
    : chunks[currentChunkKey][currentChunkIndex];

  listenAndCheck(chunk.en, null, getEl('chunksStatusText'));
};

getEl('nextChunkButton').onclick = () => {
  currentChunkIndex++;

  const activeChunks = currentChunkKey === '__generated_chunks_lesson_1__'
    ? generatedChunksLesson1
    : chunks[currentChunkKey];

if (currentChunkIndex >= activeChunks.length) {
  alert('Skvělé! Prošla jsi všechny chunky z této lekce.');
  getEl('chunksCard').style.display = 'none';
  showGeneratedChunksMenu();
  currentChunkIndex = 0;
} else {
    if (chunkMode === 'test') chunkAnswerVisible = false;

    renderChunkCard();
  }
};
